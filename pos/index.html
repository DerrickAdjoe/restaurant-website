<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Viva POS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>La Viva · Cashier</title>
<link rel="apple-touch-icon" href="../assets/images/badge_dark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2026;--panel:#16181d;--card:#262a31;--line:rgba(255,255,255,.10);--text:#fff;--muted:rgba(255,255,255,.6);--amber:#f29a2e;--amber2:#e8742a;--sun:#ffe066;--green:#22a855;--red:#ef5350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Jost,'Segoe UI',Helvetica,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:1fr 380px;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.left{display:flex;flex-direction:column;min-height:0;min-width:0;padding:18px 18px 0}
[hidden]{display:none !important}
.right{min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-family:'Bodoni Moda',Georgia,serif;font-size:24px;white-space:nowrap}
.brand small{font-family:Jost;font-size:13px;color:var(--muted);margin-left:6px}
.search{flex:1;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
.search:focus{border-color:var(--amber)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--red)}
.out{font-size:13px;color:var(--muted);padding:8px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:10px 18px;border-radius:999px;border:1.5px solid rgba(242,154,46,.5);color:var(--amber);font-weight:600;font-size:15px}
.cat.on{background:linear-gradient(90deg,var(--amber),var(--amber2));color:#fff;border-color:transparent}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding-bottom:18px}
.tile{background:var(--card);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ph{height:92px;border-radius:10px;background:#1a1d22 center/cover no-repeat}
.tile b{font-size:15px;line-height:1.2}
.tile span{color:var(--sun);font-weight:700;font-size:14px}
.right{background:var(--panel);display:flex;flex-direction:column;min-height:0;padding:18px}
.right h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;font-size:24px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.clear{font-family:Jost;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:11px 0;border-radius:12px;border:1.5px solid rgba(242,154,46,.55);color:var(--amber);font-weight:700;font-size:15px}
.seg button.on{background:linear-gradient(90deg,var(--amber),var(--amber2));color:#fff;border-color:transparent}
.lines{flex:1;overflow-y:auto;min-height:60px}
.empty{color:var(--muted);text-align:center;margin-top:40px;font-size:15px}
.line{padding:10px 0;border-bottom:1px solid var(--line)}
.lt{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.lt b{font-weight:600}
.ld{color:var(--muted);font-size:13px}
.lnote{color:var(--sun);font-size:13px;font-style:italic}
.lc{display:flex;align-items:center;gap:8px;margin-top:6px}
.q{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);font-size:18px;font-weight:700}
.qn{min-width:22px;text-align:center;font-weight:700}
.nb{margin-left:auto;font-size:13px;color:var(--amber);padding:6px}
.fields{display:grid;gap:8px;margin:10px 0}
.in{width:100%;background:transparent;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--amber)}
.row2{display:flex;gap:8px}
.gen{flex:none;padding:0 14px;border-radius:12px;border:1.5px solid rgba(242,154,46,.6);color:var(--amber);font-weight:700;font-size:14px}
.paid{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 2px}
.sw{width:46px;height:28px;border-radius:999px;background:#3a3f48;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:22px;margin:8px 0 10px}
.send{width:100%;padding:17px;border-radius:14px;background:var(--green);font-weight:700;font-size:18px}
.send:disabled{opacity:.4}
.hint{color:var(--amber);font-size:13px;text-align:center;min-height:18px;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.sheet.show{display:flex}
.box{background:var(--card);border-radius:20px;padding:22px;width:min(440px,100%)}
.box h3{margin:0 0 4px;font-size:22px}
.box p{margin:0 0 14px;color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;padding:16px;border-radius:14px;background:#1d2026;font-size:17px;font-weight:600}
.opt span{color:var(--sun)}
.cancel{display:block;margin:14px auto 0;color:var(--muted);font-size:15px;padding:8px}
.ok{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:linear-gradient(90deg,var(--amber),var(--amber2));font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#1d2026;padding:14px 22px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{position:fixed;inset:0;background:radial-gradient(70% 50% at 100% 0%,rgba(158,47,69,.22),transparent 70%),var(--bg);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.login .box{text-align:center}
.login img{width:190px;margin:0 auto 10px;display:block}
.login .in{margin-top:10px;text-align:left}
.err{color:var(--red);font-size:14px;min-height:18px;margin-top:8px}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr auto}.right{max-height:55vh}}
.pm{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.pm span{margin-right:2px}
.pm button{flex:1;padding:9px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);font-weight:600;font-size:14px;color:#fff}
.pm button.on{background:var(--green);border-color:var(--green)}
.pm button[data-pm=""].on{background:#3a3f48;border-color:#3a3f48}

.tabs{display:flex;gap:6px;align-items:flex-end;padding:calc(env(safe-area-inset-top) + 8px) 18px 0;background:#16181d;border-bottom:1px solid rgba(255,255,255,.08);height:64px}
.tab{display:flex;align-items:center;gap:8px;padding:10px 18px 12px;font-size:18px;font-weight:800;letter-spacing:.01em;color:rgba(255,255,255,.55);position:relative}
.tab .ti{font-size:22px;line-height:1}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:#fff}
.tab .bd{font-style:normal;min-width:22px;height:22px;border-radius:999px;background:var(--amber);color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px}
.tab .bd.show{display:inline-flex}
.tab .bd.green{background:var(--green)}
.app{height:calc(100vh - 64px);height:calc(100dvh - 64px);padding-top:0}
.view{height:calc(100vh - 64px);height:calc(100dvh - 64px);overflow-y:auto;padding:20px 22px 30px}
.view h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;font-size:28px;margin:0 0 4px}
.view .vs{color:var(--muted);margin:0 0 16px;font-size:14px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{background:var(--card);border-radius:16px;padding:14px 16px}
.oc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.oc .h b{font-size:22px}.oc .h span{color:var(--muted);font-size:13px}
.oc .w{color:rgba(255,255,255,.8);font-size:14px;margin:2px 0 6px}
.oc .it{color:var(--muted);font-size:13px;margin-bottom:10px}
.oc .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:18px}
.oc .t small{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#4a2323;color:#ffaaa0}
.oc .mk{display:flex;gap:6px}
.oc .mk button{flex:1;padding:12px 0;border-radius:10px;background:#2f343d;font-weight:700;font-size:15px}
.oc .mk button:active{background:var(--green)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sum div{background:var(--card);border-radius:14px;padding:12px 16px;min-width:140px}
.sum small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sum b{font-size:20px}
.pr{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.pr .ok{width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.pr .m{flex:1;min-width:0}
.pr .m b{font-size:18px}.pr .m div{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .tm{color:var(--muted);font-size:13px}
.tick{position:fixed;inset:0;background:rgba(10,12,15,.72);display:none;align-items:center;justify-content:center;z-index:50}
.tick.show{display:flex}
.tbox{background:#1d2026;border-radius:26px;padding:30px 40px;text-align:center;min-width:320px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:tpop .3s ease}
@keyframes tpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.tbox svg{width:130px;height:130px}
.tbox .tc{fill:#22a855;stroke:#22a855;stroke-width:4;stroke-dasharray:340;stroke-dashoffset:340;animation:tc .45s ease forwards}
.tbox .tp{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:tp .35s .4s ease forwards}
@keyframes tc{to{stroke-dashoffset:0}}@keyframes tp{to{stroke-dashoffset:0}}
.tbox .tt{color:#5fd38b;font-weight:700;letter-spacing:.08em;margin-top:10px;font-size:15px}
.tbox .ta{font-size:40px;font-weight:700;margin:4px 0}
.tbox .td{color:rgba(255,255,255,.8);font-size:16px}
.tkw{position:relative;width:140px;height:140px;margin:0 auto}
.tkw svg{position:relative;width:140px;height:140px;z-index:1}
.tkw .tickRing{fill:none;stroke:#5fd38b;stroke-width:6;stroke-linecap:round;stroke-dasharray:340;stroke-dashoffset:340;transform:rotate(-90deg);transform-origin:60px 60px;animation:ring .6s cubic-bezier(.65,0,.35,1) forwards}
.tkw .tc{fill:#22a855;stroke:none;transform:scale(0);transform-origin:60px 60px;animation:fillpop .45s .55s cubic-bezier(.34,1.56,.64,1) forwards}
.tkw .tp{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:tp .35s .9s ease forwards}
.tkw .rip{position:absolute;inset:6px;border-radius:50%;border:3px solid rgba(95,211,139,.7);opacity:0;animation:rip 1.4s 1s ease-out 2}
.tkw .rip.r2{animation-delay:1.35s}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes fillpop{to{transform:scale(1)}}
@keyframes rip{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.tbox svg{width:auto;height:auto}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="box">
    <img src="../assets/images/logo.webp" alt="La Viva Lounge">
    <h3>Cashier sign in</h3>
    <input class="in" id="lEmail" type="email" value="staff@lavivalounge.com" autocomplete="username">
    <input class="in" id="lPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="ok" id="lBtn">Sign in</button>
    <div class="err" id="lErr"></div>
  </div>
</div>
<nav class="tabs" id="tabs">
  <button class="tab on" data-v="order">New order</button>
  <button class="tab" data-v="open">Open orders<i class="bd" id="bdOpen"></i></button>
  <button class="tab" data-v="pays">Payments<i class="bd green" id="bdPays"></i></button>
</nav>
<div class="app">
  <section class="left">
    <div class="top">
      <div class="brand">La Viva <small>Cashier</small></div>
      <input class="search" id="search" placeholder="Search menu…" autocomplete="off">
      <span class="dot" id="dot" title="Connection"></span>
      <button class="out" id="logout">Sign out</button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="right">
    <h2>New order <button class="clear" id="clear">Clear</button></h2>
    <div class="seg" id="seg"><button class="on" data-t="Dine in">Dine in</button><button data-t="Takeout">Takeout</button></div>
    <div class="lines" id="lines"></div>
    <div class="fields">
      <input class="in" id="fname" placeholder="Customer first name" autocomplete="off" autocapitalize="words">
      <div class="row2" id="tableRow"><input class="in" id="table" placeholder="Table number" inputmode="numeric" autocomplete="off"></div>
      <div class="row2" id="ticketRow" hidden><input class="in" id="ticket" placeholder="Ticket" autocomplete="off" autocapitalize="characters"><button class="gen" id="gen">Generate</button></div>
      <div class="pm" id="pm"><span>Payment</span><button class="on" data-pm="">Not paid</button><button data-pm="cash">Cash</button><button data-pm="momo">MoMo</button><button data-pm="card">Card</button></div>
    </div>
    <div class="tot"><span>Total</span><span id="total">GH₵ 0</span></div>
    <button class="send" id="send" disabled>Send to kitchen</button>
    <div class="hint" id="hint"></div>
  </aside>
</div>
<div class="sheet" id="optSheet"><div class="box"><h3 id="oName"></h3><p>Choose a size</p><div class="opts" id="oList"></div><button class="cancel" data-close>Cancel</button></div></div>
<div class="sheet" id="noteSheet"><div class="box"><h3>Add a note</h3><p id="nFor"></p><input class="in" id="nText" placeholder="e.g. extra spicy, no onions" autocomplete="off"><button class="ok" id="nSave">Save note</button><button class="cancel" data-close>Cancel</button></div></div>
<div class="toast" id="toast"></div>
<section class="view" id="vOpen" hidden><h2>Open orders</h2><p class="vs">Today's unpaid orders. When a customer pays, tap how they paid.</p><div class="olist" id="openList"></div></section>
<section class="view" id="vPays" hidden><h2>Payments today</h2><p class="vs">Every payment confirmed today: at the counter and through Paystack (pay QR and website).</p><div class="sum" id="paySum"></div><div id="payList"></div></section>
<div class="tick" id="tick"><div class="tbox"><div class="tkw"><span class="rip"></span><span class="rip r2"></span><svg viewBox="0 0 120 120"><circle class="tickRing" cx="60" cy="60" r="54"/><circle class="tc" cx="60" cy="60" r="54"/><path class="tp" d="M36 62 l16 16 l32 -34"/></svg></div><div class="tt">PAYMENT RECEIVED</div><div class="ta" id="tkAmt"></div><div class="td" id="tkDet"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

  $('#lPass').value=''; checkSession();
};
$('#lPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lBtn').click(); });
$('#logout').onclick = async () => { await db.auth.signOut(); checkSession(); };
function priceLabel(it){ return it.opts.length > 1 ? it.opts.map(o=>o[1]).join(' · ') : ced(it.opts[0][1]); }
function renderCats(){
  $('#cats').innerHTML = MENU.map(c => `<button class="cat ${c.cat===cat?'on':''}" data-c="${c.cat}">${c.cat}</button>`).join('');
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => { cat = b.dataset.c; $('#search').value=''; renderCats(); renderGrid(); });
}
function renderGrid(){
  const q = $('#search').value.trim().toLowerCase();
  const list = q ? MENU.flatMap(c => c.items).filter(i => i.n.toLowerCase().includes(q)) : MENU.find(c => c.cat === cat).items;
  $('#grid').innerHTML = list.map((it, i) => `<button class="tile" data-item="${encodeURIComponent(it.n)}">
    <div class="ph" style="${it.img ? `background-image:url('../assets/images/${it.img}')` : ''}"></div><b>${it.n}</b><span>${priceLabel(it)}</span></button>`).join('');
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => pick(MENU.flatMap(c=>c.items).find(i => i.n === decodeURIComponent(b.dataset.item))));
}
$('#search').addEventListener('input', () => { document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on', !$('#search').value && b.dataset.c===cat)); renderGrid(); });
function pick(it){
  if (it.opts.length === 1) return add(it.n, it.opts[0][0], it.opts[0][1]);
  $('#oName').textContent = it.n;
  $('#oList').innerHTML = it.opts.map((o, i) => `<button class="opt" data-i="${i}"><b>${o[0]}</b><span>${ced(o[1])}</span></button>`).join('');
  document.querySelectorAll('#oList .opt').forEach(b => b.onclick = () => { const o = it.opts[+b.dataset.i]; add(it.n, o[0], o[1]); closeSheets(); });
  $('#optSheet').classList.add('show');
}
function add(name, detail, price){
  const ex = cart.find(c => c.name === name && c.detail === detail && !c.note);
  if (ex) ex.qty++; else cart.push({ name, detail, price, qty: 1, note: '' });
  renderCart(); toast('Added ' + name + (detail ? ' (' + detail + ')' : ''));
}
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) closeSheets(); }));
const total = () => cart.reduce((s, c) => s + c.qty * c.price, 0);
function label(){
  if (type === 'Dine in') { const t = $('#table').value.trim(); return t ? (/^\d+$/.test(t) ? 'Table ' + t : t) : ''; }
  return $('#ticket').value.trim().toUpperCase();
}
function renderCart(){
  $('#lines').innerHTML = cart.length ? cart.map((c, i) => `<div class="line">
    <div class="lt"><b>${c.name}</b><span>${ced(c.qty * c.price)}</span></div>
    ${c.detail ? `<div class="ld">${c.detail}</div>` : ''}${c.note ? `<div class="lnote">${c.note}</div>` : ''}
    <div class="lc"><button class="q" data-m="${i}">−</button><span class="qn">${c.qty}</span><button class="q" data-p="${i}">+</button><button class="nb" data-n="${i}">${c.note ? 'Edit note' : 'Add note'}</button></div></div>`).join('')
    : '<p class="empty">Tap items to add them</p>';
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const c = cart[+b.dataset.m]; c.qty--; if (c.qty < 1) cart.splice(+b.dataset.m, 1); renderCart(); });
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { cart[+b.dataset.p].qty++; renderCart(); });
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { noteIdx = +b.dataset.n; $('#nFor').textContent = cart[noteIdx].name; $('#nText').value = cart[noteIdx].note; $('#noteSheet').classList.add('show'); setTimeout(()=>$('#nText').focus(),50); });
  $('#total').textContent = ced(total());
  validate();
}
$('#nSave').onclick = () => { if (noteIdx > -1) cart[noteIdx].note = $('#nText').value.trim(); closeSheets(); renderCart(); };
function validate(){
  const name = $('#fname').value.trim(), lab = label();
  const miss = []; if (!cart.length) miss.push('items'); if (!name) miss.push('first name'); if (!lab) miss.push(type === 'Dine in' ? 'table number' : 'ticket');
  $('#send').disabled = miss.length > 0 || busy;
  $('#hint').textContent = cart.length && miss.length ? 'Add ' + miss.join(' and ') : '';
}
['#fname', '#table', '#ticket'].forEach(s => $(s).addEventListener('input', validate));
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  type = b.dataset.t; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  $('#tableRow').hidden = type !== 'Dine in'; $('#ticketRow').hidden = type !== 'Takeout'; validate();
});
$('#gen').onclick = () => { const L = 'ABCDEFGHJKLMNPRSTUVWXYZ'; $('#ticket').value = L[Math.floor(Math.random() * L.length)] + '-' + String(1 + Math.floor(Math.random() * 99)).padStart(2, '0'); validate(); };
function setPM(m){ payMethod = m; paid = !!m; document.querySelectorAll('#pm button').forEach(b => b.classList.toggle('on', b.dataset.pm === m)); }
document.querySelectorAll('#pm button').forEach(b => b.onclick = () => setPM(b.dataset.pm));
function reset(){ cart = []; $('#fname').value = ''; $('#table').value = ''; $('#ticket').value = ''; setPM(''); renderCart(); }
$('#clear').onclick = () => { if (!cart.length || confirm('Clear this order?')) reset(); };
$('#send').onclick = async () => {
  if (busy) return; busy = true; validate();
  const row = { source: 'cashier', order_type: type, label: label(), first_name: $('#fname').value.trim(),
    items: cart.map(c => ({ name: c.name, detail: c.detail, qty: c.qty, price: c.price, note: c.note })),
    total: total(), paid, payment_method: payMethod || null, paid_at: paid ? new Date().toISOString() : null };
  const { error } = await db.from('orders').insert(row);
  busy = false;
  if (error) { $('#hint').textContent = 'Could not send. Check the internet and try again.'; validate(); return; }
  toast('Sent to kitchen: ' + row.label + ' · ' + row.first_name); if (row.paid) showTick(row.total, row.payment_method, row.label + ' · ' + row.first_name); reset(); loadToday();
};
function net(){ $('#dot').classList.toggle('off', !navigator.onLine); }
addEventListener('online', net); addEventListener('offline', net); net();

/* ---------- tabs, open orders, payments, green tick ---------- */
const MNAME = { cash: 'Cash', momo: 'MoMo', card: 'Card', website: 'Website', mobile_money: 'MoMo' };
let view = 'order', todayOrders = [], todayPays = [], liveOn = false, unseenPays = 0, tkAudio = null, reloadT = null;
const tKey = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const escH = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.querySelector('.app').style.display = v === 'order' ? '' : 'none';
  $('#vOpen').hidden = v !== 'open'; $('#vPays').hidden = v !== 'pays';
  if (v === 'pays') { unseenPays = 0; renderPays(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showView(t.dataset.v));
function tkChime(){ try { tkAudio = tkAudio || new (window.AudioContext||window.webkitAudioContext)(); tkAudio.resume(); const t = tkAudio.currentTime + .05;
  /* bright "ka-ching" success sound: a quick sparkle then two bell tones */
  const bell = (f, start, len, vol) => { [1, 2.01, 3.02].forEach((h, i) => { const o = tkAudio.createOscillator(), g = tkAudio.createGain();
    o.type = 'sine'; o.frequency.value = f * h; o.connect(g); g.connect(tkAudio.destination);
    g.gain.setValueAtTime(.0001, t + start); g.gain.exponentialRampToValueAtTime(vol / (i + 1), t + start + .01); g.gain.exponentialRampToValueAtTime(.0001, t + start + len);
    o.start(t + start); o.stop(t + start + len + .05); }); };
  [2637, 3136, 3520].forEach((f, i) => bell(f, i * .04, .12, .06));
  bell(1318.5, .55, .9, .32); bell(1760, .78, 1.3, .3);
} catch(e){} }
function showTick(amount, method, who){
  const box = $('#tick .tbox'), clone = box.cloneNode(true); box.replaceWith(clone);
  $('#tkAmt').textContent = ced(+amount || 0);
  $('#tkDet').textContent = [MNAME[method] || method, who].filter(Boolean).join(' · ');
  $('#tick').classList.add('show'); tkChime();
  clearTimeout(showTick.t); showTick.t = setTimeout(() => $('#tick').classList.remove('show'), 4500);
}
$('#tick').onclick = () => $('#tick').classList.remove('show');
async function loadToday(){
  const since = new Date(); since.setHours(0,0,0,0); const iso = since.toISOString();
  const [o, p] = await Promise.all([
    db.from('orders').select('*').gte('created_at', iso).order('created_at', { ascending: false }).limit(300),
    db.from('payments').select('*').gte('created_at', iso).order('created_at', { ascending: false }).limit(300)
  ]);
  if (o && o.data) todayOrders = o.data; if (p && p.data) todayPays = p.data;
  renderOpen(); renderPays();
}
function renderOpen(){
  const list = todayOrders.filter(o => !o.paid && o.status !== 'cancelled');
  $('#bdOpen').textContent = list.length; $('#bdOpen').classList.toggle('show', list.length > 0);
  $('#openList').innerHTML = list.length ? list.map(o => `<div class="oc"><div class="h"><b>${escH(o.label)}</b><span>${tKey(o.created_at)} · ${escH(o.status)}</span></div>
    <div class="w">${escH(o.first_name)} · ${escH(o.order_type)}</div>
    <div class="it">${(o.items || []).map(i => i.qty + '× ' + escH(i.name)).join(', ')}</div>
    <div class="t"><span>${ced(+o.total)}</span><small>UNPAID</small></div>
    <div class="mk"><button data-pay="${o.id}" data-m="cash">Cash</button><button data-pay="${o.id}" data-m="momo">MoMo</button><button data-pay="${o.id}" data-m="card">Card</button></div></div>`).join('')
    : '<p class="empty">No unpaid orders. Everything is settled 👍</p>';
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => markPaidPOS(+b.dataset.pay, b.dataset.m));
}
async function markPaidPOS(id, m){
  const o = todayOrders.find(x => x.id === id); if (!o) return;
  const { error } = await db.from('orders').update({ paid: true, payment_method: m, paid_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Could not save. Check the internet.'); return; }
  Object.assign(o, { paid: true, payment_method: m, paid_at: new Date().toISOString() });
  showTick(o.total, m, o.label + ' · ' + o.first_name); renderOpen(); renderPays();
}
function renderPays(){
  const counter = todayOrders.filter(o => o.paid && o.status !== 'cancelled' && ['cash','momo','card'].includes(o.payment_method))
    .map(o => ({ t: o.paid_at || o.created_at, amount: +o.total, m: o.payment_method, who: o.label + ' · ' + o.first_name, ref: 'At the counter' }));
  const ps = todayPays.map(p => ({ t: p.paid_at || p.created_at, amount: +(p.amount_before_fee ?? p.amount), m: p.channel || 'mobile_money', who: [p.customer_name, p.table_ticket].filter(Boolean).join(' · ') || (p.source === 'counter_qr' ? 'Pay QR' : 'Website'), ref: (p.source === 'counter_qr' ? 'Pay QR · ' : 'Website · ') + p.reference }));
  const sum = (l, f) => l.filter(f).reduce((a, x) => a + x.amount, 0);
  $('#paySum').innerHTML = `<div><small>Cash</small><b>${ced(sum(counter, x => x.m === 'cash'))}</b></div><div><small>MoMo (counter)</small><b>${ced(sum(counter, x => x.m === 'momo'))}</b></div><div><small>Card (counter)</small><b>${ced(sum(counter, x => x.m === 'card'))}</b></div><div><small>Paystack (QR &amp; web)</small><b>${ced(sum(ps, () => true))}</b></div>`;
  const all = counter.concat(ps).sort((a, b) => new Date(b.t) - new Date(a.t));
  $('#payList').innerHTML = all.length ? all.map(x => `<div class="pr"><div class="ok"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
    <div class="m"><b>${ced(x.amount)}</b> · ${escH(MNAME[x.m] || x.m)}<div>${escH(x.who)} · ${escH(x.ref)}</div></div><div class="tm">${tKey(x.t)}</div></div>`).join('') : '<p class="empty">No payments yet today</p>';
  $('#bdPays').textContent = unseenPays; $('#bdPays').classList.toggle('show', unseenPays > 0 && view !== 'pays');
}
function startLive(){
  if (liveOn) return; liveOn = true; loadToday();
  db.channel('pos-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'payments' }, ev => {
      const p = ev.new; todayPays.unshift(p); if (view !== 'pays') unseenPays++;
      showTick(p.amount_before_fee ?? p.amount, p.channel || 'mobile_money', [p.customer_name, p.table_ticket].filter(Boolean).join(' · ') || (p.source === 'counter_qr' ? 'Pay QR' : 'Website order'));
      renderPays();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => { clearTimeout(reloadT); reloadT = setTimeout(loadToday, 400); })
    .subscribe();
  setInterval(loadToday, 30000);
}
document.addEventListener('touchstart', () => { try { tkAudio = tkAudio || new (window.AudioContext||window.webkitAudioContext)(); tkAudio.resume(); } catch(e){} }, { once: true });
renderCats(); renderGrid(); renderCart(); checkSession();
</script>
</body>
</html>
