<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>La Viva · Order status</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2026;--card:#262a31;--text:#fff;--muted:rgba(255,255,255,.62);--amber:#f29a2e;--amber2:#e8742a;--sun:#ffe066;--ok:#5fd38b;--okbg:#173a26}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(60% 50% at 100% 0%,rgba(158,47,69,.25),transparent 70%),var(--bg);color:var(--text);font-family:Jost,'Segoe UI',Helvetica,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
[hidden]{display:none !important}
.wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:2.2vw 2.6vw}
.head{display:flex;align-items:center;gap:1.4vw;margin-bottom:1.6vw}
.head img{height:4.6vw;min-height:44px}
.tag{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-size:clamp(18px,1.8vw,34px);color:var(--muted)}
.sp{flex:1}
.clock{font-weight:700;font-size:clamp(22px,2.4vw,46px);color:var(--sun)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.4vw;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 1.2vw;font-size:clamp(22px,2.4vw,46px);letter-spacing:.12em;font-weight:700}
.p h2{color:var(--sun)}.r h2{color:var(--ok)}
.list{flex:1;display:flex;flex-direction:column;gap:1vw;overflow:hidden}
.item{background:var(--card);border-radius:1.2vw;padding:1.2vw 1.6vw;display:flex;align-items:center;justify-content:space-between;gap:1vw;animation:in .5s ease}
.item .l{display:flex;align-items:baseline;gap:1vw;min-width:0}
.item b{font-size:clamp(28px,3.4vw,68px);font-weight:700;line-height:1;white-space:nowrap}
.item span{font-size:clamp(18px,1.9vw,38px);color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item em{font-style:normal;font-weight:700;font-size:clamp(18px,1.9vw,38px);color:var(--sun);white-space:nowrap}
.r .item{background:var(--okbg);border:3px solid var(--ok)}
.r .item em{color:var(--ok)}
.r .item.fresh{animation:in .5s ease, glow 1.4s ease-in-out 0s 6}
@keyframes in{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 .6vw rgba(95,211,139,.35)}}
.empty{color:var(--muted);font-size:clamp(16px,1.5vw,30px);margin-top:1vw}
.more{color:var(--muted);font-size:clamp(14px,1.3vw,26px)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1.2vw;color:var(--muted);font-size:clamp(14px,1.3vw,26px)}
.foot b{color:#fff}
.fs{background:transparent;border:1.5px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;color:var(--muted);font-size:14px}
.start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:10;text-align:center;padding:20px}
.start img{width:260px}
.start button{padding:18px 34px;border-radius:14px;background:linear-gradient(90deg,var(--amber),var(--amber2));font-weight:700;font-size:20px}
.start p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="start" id="start">
  <img src="../assets/images/logo.webp" alt="La Viva Lounge">
  <button id="go" autofocus>Start customer screen</button>
  <p>Press once (or OK on the remote) so the "Ready" chime can play.</p>
</div>
<div class="wrap">
  <div class="head">
    <img src="../assets/images/logo.webp" alt="La Viva Lounge">
    <div class="tag">Good food. Good mood.</div>
    <div class="sp"></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="cols">
    <section class="col p"><h2>PREPARING</h2><div class="list" id="prep"></div></section>
    <section class="col r"><h2>READY ✓</h2><div class="list" id="ready"></div></section>
  </div>
  <div class="foot"><div>Order online at <b>lavivalounge.com</b> · Pay with Mobile Money</div><button class="fs" id="fs">Full screen</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://znxakuzpofjspahvdacf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8G2xLZjBp3dww4J4Kz1m5A_8GXPVudw';
const MAX_PREP = 6, MAX_READY = 5;
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = t => Math.floor((Date.now() - new Date(t).getTime()) / 60000);
let audio = null, seenReady = null, rows = [];
function chime(){
  if (!audio) return; const t = audio.currentTime;
  [[660,0],[880,.22],[1320,.44]].forEach(([f, d]) => { const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.4, t + d + .03); g.gain.exponentialRampToValueAtTime(.0001, t + d + .5);
    o.start(t + d); o.stop(t + d + .55); });
}
function render(){
  const prep = rows.filter(r => r.status === 'preparing').sort((a, b) => new Date(a.started_at || a.updated_at) - new Date(b.started_at || b.updated_at));
  const ready = rows.filter(r => r.status === 'ready').sort((a, b) => new Date(b.ready_at || b.updated_at) - new Date(a.ready_at || a.updated_at));
  const left = r => { const l = (r.eta_minutes || 10) - mins(r.started_at || r.updated_at); return l > 1 ? '~' + l + ' min' : 'Almost ready'; };
  $('#prep').innerHTML = prep.length ? prep.slice(0, MAX_PREP).map(r => `<div class="item"><div class="l"><b>${esc(r.label)}</b><span>${esc(r.first_name)}</span></div><em>${left(r)}</em></div>`).join('')
    + (prep.length > MAX_PREP ? `<div class="more">+ ${prep.length - MAX_PREP} more being prepared</div>` : '') : '<p class="empty">No orders being prepared</p>';
  const fresh = r => mins(r.ready_at || r.updated_at) < 1;
  $('#ready').innerHTML = ready.length ? ready.slice(0, MAX_READY).map(r => `<div class="item ${fresh(r) ? 'fresh' : ''}"><div class="l"><b>${esc(r.label)}</b><span>${esc(r.first_name)}</span></div><em>Ready!</em></div>`).join('')
    + (ready.length > MAX_READY ? `<div class="more">+ ${ready.length - MAX_READY} more ready</div>` : '') : '<p class="empty">Ready orders appear here</p>';
}
async function load(){
  const { data, error } = await db.from('ready_board').select('*');
  if (error || !data) return;
  rows = data;
  const ids = new Set(data.filter(r => r.status === 'ready').map(r => r.id));
  if (seenReady && [...ids].some(id => !seenReady.has(id))) chime();
  seenReady = ids;
  render();
}
$('#go').onclick = () => {
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  $('#start').hidden = true; document.documentElement.requestFullscreen?.().catch(() => {});
  load(); setInterval(load, 4000); setInterval(render, 20000);
};
$('#fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
setInterval(() => { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }, 1000);
</script>
</body>
</html>
