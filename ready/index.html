<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>La Viva · Order status</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2026;--card:#262a31;--text:#fff;--muted:rgba(255,255,255,.62);--amber:#f29a2e;--amber2:#e8742a;--sun:#ffe066;--ok:#5fd38b;--okd:#22a855}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(70% 45% at 50% 0%,rgba(158,47,69,.42),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(158,47,69,.25),transparent 70%),var(--bg);color:var(--text);font-family:Jost,'Segoe UI',Helvetica,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
[hidden]{display:none !important}
.wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:2vw 2.4vw}
.head{display:flex;align-items:center;gap:1.4vw;margin-bottom:1.4vw}
.head img{height:4.4vw;min-height:44px}
.tag{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-size:clamp(18px,1.7vw,34px);color:var(--muted)}
.sp{flex:1}
.clock{font-weight:700;font-size:clamp(22px,2.3vw,44px);color:var(--sun)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.2vw;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 1vw;font-size:clamp(20px,2vw,40px);letter-spacing:.14em;font-weight:700;color:var(--sun);text-align:center}
.list{flex:1;display:flex;flex-direction:column;gap:.9vw;overflow:hidden}
.card{background:rgba(22,24,29,.92);border-radius:1.1vw;padding:.9vw 1.5vw 1.1vw;border:2px solid transparent;animation:in .45s ease}
.card.ready{border-color:var(--ok)}
.card.fresh{animation:in .45s ease, glow 1.4s ease-in-out 0s 6}
@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 .55vw rgba(95,211,139,.35)}}
.top{display:flex;align-items:baseline;gap:1vw;min-width:0}
.top b{font-size:clamp(24px,2.6vw,52px);font-weight:700;line-height:1.05;white-space:nowrap}
.top span{font-size:clamp(16px,1.6vw,32px);color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;justify-content:flex-end;align-items:baseline;gap:.8vw;margin:.2vw 0 .55vw}
.st{font-weight:800;font-size:clamp(16px,1.7vw,34px);letter-spacing:.03em;text-transform:uppercase}
.eta{font-size:clamp(14px,1.3vw,26px);color:var(--muted);font-weight:600}
.s-new .st{color:#fff}.s-prep .st{color:var(--sun)}.s-almost .st{color:var(--amber)}.s-ready .st{color:var(--ok)}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:.7vw;padding:0 .6vw}
.seg{height:clamp(14px,1.5vw,30px);border-radius:999px;transform:skewX(-28deg);border:2px solid rgba(255,255,255,.35);background:transparent;position:relative;overflow:hidden}
.seg.on{border-color:transparent;background:linear-gradient(90deg,var(--amber),var(--amber2))}
.s-ready .seg.on{background:linear-gradient(90deg,#4cc77a,var(--ok))}
.seg.live::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sh 1.6s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{color:var(--muted);font-size:clamp(16px,1.5vw,30px);text-align:center;margin-top:2vw}
.more{color:var(--muted);font-size:clamp(13px,1.1vw,22px);letter-spacing:.04em;margin-left:.6vw}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1vw;color:var(--muted);font-size:clamp(14px,1.25vw,26px)}
.foot b{color:#fff}
.fs{background:transparent;border:1.5px solid rgba(255,255,255,.15);border-radius:999px;padding:8px 16px;color:var(--muted);font-size:14px}
.start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:10;text-align:center;padding:20px}
.start img{width:260px}
.start button{padding:18px 34px;border-radius:14px;background:linear-gradient(90deg,var(--amber),var(--amber2));font-weight:700;font-size:20px}
.start p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="start" id="start">
  <img src="../assets/images/logo.webp" alt="La Viva Lounge">
  <button id="go" autofocus>Start customer screen</button>
  <p>Press once (or OK on the remote) so the "Ready" chime can play.</p>
</div>
<div class="wrap">
  <div class="head">
    <img src="../assets/images/logo.webp" alt="La Viva Lounge">
    <div class="tag">Good food. Good mood.</div>
    <div class="sp"></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="cols">
    <section class="col"><h2>DINE IN <small class="more" id="dineMore"></small></h2><div class="list" id="dine"></div></section>
    <section class="col"><h2>TAKEOUT &amp; ONLINE <small class="more" id="takeMore"></small></h2><div class="list" id="take"></div></section>
  </div>
  <div class="foot"><div>Order online at <b>lavivalounge.com</b> · Pay with Mobile Money</div><button class="fs" id="fs">Full screen</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://znxakuzpofjspahvdacf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8G2xLZjBp3dww4J4Kz1m5A_8GXPVudw';
const MAX_CARDS = 4;
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = t => (Date.now() - new Date(t).getTime()) / 60000;
let audio = null, seenReady = null, rows = [];
function chime(){
  if (!audio) return; const t = audio.currentTime;
  [[660,0],[880,.22],[1320,.44]].forEach(([f, d]) => { const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.4, t + d + .03); g.gain.exponentialRampToValueAtTime(.0001, t + d + .5);
    o.start(t + d); o.stop(t + d + .55); });
}
/* Stage of each order: 0 received, 1-3 preparing (fills as time passes), 4 ready */
function stage(r){
  if (r.status === 'ready') return { n: 4, cls: 's-ready', text: 'Ready!', eta: '' };
  if (r.status === 'new') return { n: 0, cls: 's-new', text: 'Order received', eta: '' };
  const eta = r.eta_minutes || 10, gone = mins(r.started_at || r.updated_at), left = Math.max(0, Math.ceil(eta - gone)), p = gone / eta;
  if (p >= .66) return { n: 3, cls: 's-almost', text: 'Almost ready', eta: left > 1 ? '~' + left + ' min' : '' };
  return { n: p >= .33 ? 2 : 1, cls: 's-prep', text: 'Preparing', eta: '~' + left + ' min' };
}
function who(r){
  if (r.order_type === 'Online') return `<b>${esc(r.first_name)}</b><span>Online order</span>`;
  if (r.order_type === 'Takeout') return `<b>${esc(r.label)}</b><span>${esc(r.first_name)}</span>`;
  return `<b>${esc(r.label)}</b><span>${esc(r.first_name)}</span>`;
}
function card(r){
  const s = stage(r), fresh = r.status === 'ready' && mins(r.ready_at || r.updated_at) < 1;
  const segs = [0,1,2,3].map(i => `<i class="seg ${i < s.n ? 'on' : ''} ${i === s.n - 1 && s.n < 4 ? 'live' : ''}"></i>`).join('');
  return `<div class="card ${s.cls} ${r.status === 'ready' ? 'ready' : ''} ${fresh ? 'fresh' : ''}">
    <div class="top">${who(r)}</div>
    <div class="mid"><span class="st">${s.text}</span>${s.eta ? `<span class="eta">${s.eta}</span>` : ''}</div>
    <div class="bar">${segs}</div></div>`;
}
function fill(el, list, empty){
  const order = { ready: 0, preparing: 1, new: 2 };
  list.sort((a, b) => order[a.status] - order[b.status] || new Date(a.updated_at) - new Date(b.updated_at));
  $(el + 'More').textContent = list.length > MAX_CARDS ? '+ ' + (list.length - MAX_CARDS) + ' more' : '';
  $(el).innerHTML = list.length ? list.slice(0, MAX_CARDS).map(card).join('')  : `<p class="empty">${empty}</p>`;
}
function render(){
  fill('#dine', rows.filter(r => r.order_type === 'Dine in'), 'Dine-in orders appear here');
  fill('#take', rows.filter(r => r.order_type !== 'Dine in'), 'Takeout and online orders appear here');
}
async function load(){
  const { data, error } = await db.from('ready_board').select('*');
  if (error || !data) return;
  rows = data;
  const ids = new Set(data.filter(r => r.status === 'ready').map(r => r.id));
  if (seenReady && [...ids].some(id => !seenReady.has(id))) chime();
  seenReady = ids;
  render();
}
$('#go').onclick = () => {
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  $('#start').hidden = true; document.documentElement.requestFullscreen?.().catch(() => {});
  load(); setInterval(load, 4000); setInterval(render, 15000);
};
$('#fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
setInterval(() => { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }, 1000);
</script>
</body>
</html>
